[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-readiness-toolkit"
version = "0.1.0"
description = "NIST/ETSI/CNSA 2.0 PQC readiness for Windows fleets"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Alex Zelenski", email = "zqmcomputing@gmail.com" }]
dependencies = [
    "zqm-intel-platforms>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --ignore=vendor/liboqs/tests"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I"]
ignore = ["E501"]
exclude = [".git", "__pycache__", "dist", "build", "vendor/liboqs"]
src = ["scripts", "tests"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
exclude = "(dist|build|vendor)/"
files = ["scripts", "tests"]

[tool.bandit]
exclude_dirs = ["tests", "dist", "build", "vendor", "evidence"]
skips = ["B101"]

[tool.codespell]
skip = ".git,*.map,*.p7s,dist,build,vendor,evidence"
ignore-words-list = ""
